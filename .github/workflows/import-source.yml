name: Import v0.83 source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source archive
        run: git show 8b28edae3b46547fd184f8eb5483e2a086998d96:wow335android-v0.83-github.zip > wow335android-v0.83-github.zip
      - name: Verify and extract source archive
        shell: python
        run: |
          import hashlib, pathlib, zipfile
          archive = pathlib.Path("wow335android-v0.83-github.zip")
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == "d339de7e2573f3d332f4a623091194edaa2767846cab461106a946d8da25f2db"
          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(archive) as source:
              for entry in source.infolist():
                  path = pathlib.PurePosixPath(entry.filename)
                  assert not path.is_absolute() and ".." not in path.parts
                  assert path.parts[0] != ".git"
                  if path.parts[0] == ".github":
                      continue
                  target = root.joinpath(*path.parts)
                  if entry.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(source.read(entry))
                      mode = (entry.external_attr >> 16) & 0o777
                      if mode:
                          target.chmod(mode)
          archive.unlink()
      - name: Commit source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A
          git diff --cached --quiet || git commit -m "Complete Android v0.83 source import"
          git push origin HEAD:main
