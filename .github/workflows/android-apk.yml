name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'Tools/AndroidPort/**', 'ThirdParty/StormLib/**', 'Engine/Source/**', 'WoW/Source/**', 'CMakeLists.txt', '.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK (arm64-v8a)
        working-directory: android
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;35.0.0" "platforms;android-35"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wow-android-arm64-apk
          path: android/app/build/outputs/apk/debug/*.apk
